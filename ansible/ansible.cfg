# Iris benchmark host provisioning.
#
# Run from this directory or from a script that exports
# ANSIBLE_CONFIG=<repo>/ansible/ansible.cfg so these settings apply.
#
# The inventory contains only the approved benchmark host. Production nodes are
# read-only and must never appear here.

[defaults]
inventory = inventory/loadtest/hosts
roles_path = roles
collections_path = ./collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
deprecation_warnings = False
# Extra vars / inventory vars are validated by the explicit benchmark_host guard.

[inventory]
enable_plugins = ini, yaml

[ssh_connection]
# Reuse the operator's existing OpenSSH control sockets. This preserves host
# aliases, ProxyJump, hardware-backed keys, and the sockets already present under
# ~/.ssh/sockets (for example codedang8.sock). `%h` resolves to the inventory
# host name. ControlPath is supported by OpenSSH; remove the Control* options if
# a platform's ssh does not accept them.
#
# Do NOT pass StrictHostKeyChecking here. It would override both the operator's
# ~/.ssh/config and host_key_checking=True above, silently accepting new host
# keys and defeating the "verify host keys" safety requirement.
ssh_args = -C -o ControlMaster=auto -o ControlPersist=3600 -o ControlPath=~/.ssh/sockets/%h.sock -o ServerAliveInterval=30 -o ServerAliveCountMax=4
pipelining = True
retries = 3
timeout = 30
